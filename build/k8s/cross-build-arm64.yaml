apiVersion: v1
kind: Pod
metadata:
  name: sr-cross-build-arm64-01
  namespace: inference-stack-build
  labels:
    app.kubernetes.io/part-of: inference-stack
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: gpu-node
  containers:
  - name: build
    image: docker.io/library/golang@sha256:a02d35efc036053fdf0da8c15919276bf777a80cbfda6a35c5e9f087e652adfc
    command:
    - bash
    - /workspace/scripts/cross-build-arm64.sh
    workingDir: /workspace
    env:
    - name: GOPROXY
      value: https://goproxy.cn
    - name: GOMAXPROCS
      value: '3'
    - name: GOCACHE
      value: /workspace/.work/go-build-cache
    - name: GOMODCACHE
      value: /workspace/.work/go-mod-cache
    resources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        cpu: '3'
        memory: 4Gi
    volumeMounts:
    - name: project
      mountPath: /workspace
  volumes:
  - name: project
    hostPath:
      path: /srv/semantic-router-multimodal
      type: Directory
  activeDeadlineSeconds: 3600
  initContainers:
  - name: extract-libraries
    image: ghcr.io/vllm-project/semantic-router/extproc@sha256:295a7da1ac432c950667083208a5a227e695efdc7b53502139d4c80c0b18b061
    command:
    - python3
    - /workspace/scripts/extract-oci-libraries.py
    - --archive
    - /workspace/dist/base-arm64.oci.tar
    - --base-digest
    - sha256:295a7da1ac432c950667083208a5a227e695efdc7b53502139d4c80c0b18b061
    - --platform
    - linux/arm64
    - --output
    - /workspace/.work/native-arm64/rootfs
    volumeMounts:
    - name: project
      mountPath: /workspace
    resources:
      requests:
        cpu: '1'
        memory: 256Mi
      limits:
        cpu: '2'
        memory: 1Gi
