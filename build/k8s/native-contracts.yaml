apiVersion: v1
kind: Pod
metadata:
  name: sr-native-contracts-01
  namespace: inference-stack-build
  labels:
    app.kubernetes.io/part-of: inference-stack
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: gpu-node
  containers:
  - name: build
    image: docker.io/library/golang@sha256:a02d35efc036053fdf0da8c15919276bf777a80cbfda6a35c5e9f087e652adfc
    command:
    - bash
    - -ec
    - 'export CGO_ENABLED=1 CGO_LDFLAGS=-L/workspace/.work/native/lib LD_LIBRARY_PATH=/workspace/.work/native/lib

      cd /workspace/.work/upstream/src/semantic-router

      mkdir -p /workspace/dist/contracts

      go run -p 3 ../../tools/codegen/configschema/main.go --repository-root ../..
      --check

      go run -p 3 ../../tools/codegen/openapi/main.go -format json -o /workspace/dist/contracts/apiserver.openapi.json

      go run -p 3 ../../tools/codegen/openapi/main.go -format index -o /workspace/dist/contracts/apiserver-endpoint-index.md

      sha256sum /workspace/dist/contracts/*

      '
    workingDir: /workspace
    env:
    - name: GOPROXY
      value: https://goproxy.cn
    - name: GOMAXPROCS
      value: '3'
    - name: GOCACHE
      value: /workspace/.work/go-build-cache
    - name: GOMODCACHE
      value: /workspace/.work/go-mod-cache
    resources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        cpu: '3'
        memory: 4Gi
    volumeMounts:
    - name: project
      mountPath: /workspace
  volumes:
  - name: project
    hostPath:
      path: /srv/semantic-router-multimodal
      type: Directory
