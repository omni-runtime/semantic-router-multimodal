apiVersion: v1
kind: Pod
metadata:
  name: sr-arm64-base-01
  namespace: inference-stack-build
  labels:
    app.kubernetes.io/part-of: inference-stack
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: gpu-node
  containers:
  - name: package
    image: ghcr.io/vllm-project/semantic-router/extproc@sha256:295a7da1ac432c950667083208a5a227e695efdc7b53502139d4c80c0b18b061
    command:
    - bash
    - -ec
    - 'base=ghcr.io/vllm-project/semantic-router/extproc@sha256:295a7da1ac432c950667083208a5a227e695efdc7b53502139d4c80c0b18b061

      mkdir -p /workspace/dist

      /node/k3s ctr --address /run/k3s/containerd/containerd.sock --namespace k8s.io
      images pull --platform linux/arm64 "$base"

      /node/k3s ctr --address /run/k3s/containerd/containerd.sock --namespace k8s.io
      images export --platform linux/arm64 /workspace/dist/base-arm64.oci.tar.tmp
      "$base"

      mv /workspace/dist/base-arm64.oci.tar.tmp /workspace/dist/base-arm64.oci.tar

      sha256sum /workspace/dist/base-arm64.oci.tar

      '
    workingDir: /workspace
    securityContext:
      runAsUser: 0
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '2'
        memory: 1Gi
    volumeMounts:
    - name: project
      mountPath: /workspace
    - name: ctr
      mountPath: /node/k3s
      readOnly: true
    - name: containerd
      mountPath: /run/k3s/containerd/containerd.sock
  volumes:
  - name: project
    hostPath:
      path: /srv/semantic-router-multimodal
      type: Directory
  - name: ctr
    hostPath:
      path: /usr/local/bin/k3s
      type: File
  - name: containerd
    hostPath:
      path: /run/k3s/containerd/containerd.sock
      type: Socket
  activeDeadlineSeconds: 600
