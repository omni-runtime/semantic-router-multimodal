apiVersion: v1
kind: Pod
metadata:
  name: sr-runtime-link-check
  namespace: inference-stack-build
  labels: {app.kubernetes.io/part-of: inference-stack}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector: {kubernetes.io/hostname: gpu-node}
  containers:
    - name: check
      image: ghcr.io/vllm-project/semantic-router/extproc@sha256:295a7da1ac432c950667083208a5a227e695efdc7b53502139d4c80c0b18b061
      command: [/binary/router, --help]
      env: [{name: LD_LIBRARY_PATH, value: /app/lib}]
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: '1', memory: 256Mi}
      volumeMounts: [{name: binary, mountPath: /binary, readOnly: true}]
  volumes:
    - name: binary
      hostPath: {path: /srv/semantic-router-multimodal/dist/linux-amd64, type: Directory}
