apiVersion: v1
kind: Pod
metadata:
  name: sr-package-arm64-01
  namespace: inference-stack-build
  labels:
    app.kubernetes.io/part-of: inference-stack
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: gpu-node
  containers:
  - name: package
    image: ghcr.io/vllm-project/semantic-router/extproc@sha256:295a7da1ac432c950667083208a5a227e695efdc7b53502139d4c80c0b18b061
    command:
    - bash
    - /workspace/scripts/package-arm64.sh
    workingDir: /workspace
    securityContext:
      runAsUser: 0
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '2'
        memory: 1Gi
    volumeMounts:
    - name: project
      mountPath: /workspace
  volumes:
  - name: project
    hostPath:
      path: /srv/semantic-router-multimodal
      type: Directory
