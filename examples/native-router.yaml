      api_key_env: MODEL_API_KEY
routing:
  strategy: priority
  candidate_requirements: &id001
    capabilities: declared
    context: known_limits
  data_policy: &id002
    replay: false
  decisions: &id003
  - name: capable-native-model
    priority: 1
    rules:
      operator: AND
      conditions: []
    algorithm:
      type: static
    modelRefs:
    - model: chat
    - model: speech
    - model: images
    - model: audio
    - model: transcription
    - model: translation
    - model: image-edit
    - model: video-sync
    - model: video-task
    - model: realtime
    - model: speech-stream
  modelCards:
  - name: chat
    capabilities:
    - text
    - image_input
    - audio_input
    - video_input
    - audio_output
    - tools
    - structured_json
    context_window_size: 131072
    max_output_tokens: 512
  - name: speech
    capabilities:
    - text
    - speech_generation
    context_window_size: 131072
    max_output_tokens: 512
  - name: images
    capabilities:
    - text
    - image_generation
    context_window_size: 131072
    max_output_tokens: 0
  - name: audio
    capabilities:
    - text
    - audio_generation
    context_window_size: 131072
    max_output_tokens: 0
  - name: transcription
    capabilities:
    - text
    - audio_input
    - transcription
    context_window_size: 131072
    max_output_tokens: 512
  - name: translation
    capabilities:
    - text
    - audio_input
    - translation
    context_window_size: 131072
    max_output_tokens: 512
  - name: image-edit
    capabilities:
    - text
    - image_input
    - image_editing
    context_window_size: 131072
    max_output_tokens: 0
  - name: video-sync
    capabilities:
    - text
    - image_input
    - audio_input
    - video_input
    - video_output
    - audio_output
    - video_generation
    context_window_size: 131072
    max_output_tokens: 0
  - name: video-task
    capabilities:
    - text
    - image_input
    - audio_input
    - video_input
    - video_output
    - audio_output
    - video_generation
    context_window_size: 131072
    max_output_tokens: 0
  - name: realtime
    capabilities:
    - text
    - realtime
    - audio_input
    - audio_output
    context_window_size: 32768
    max_output_tokens: 0
  - name: speech-stream
    capabilities:
    - text
    - realtime
    - speech_generation
    - audio_output
    context_window_size: 32768
    max_output_tokens: 0
entrypoints:
- model_names:
  - local-only
  recipe: local-only
recipes:
- name: local-only
  routing:
    strategy: priority
    candidate_requirements: *id001
    data_policy: *id002
    decisions: *id003
global:
  router:
    auto_model_names:
    - auto
    require_entrypoint: true
    skip_processing:
      enabled: false
    fallback:
      version: 1
      enabled: false
  stores:
    response_cache:
      enabled: false
      backend_type: memory
    media_bindings:
      address: media-bindings:6379
      ttl_seconds: 3600
      max_total_bytes: 16777216
      instances:
        video-task: single-video-worker-generation-1
