# Illustrative capabilities and capacity only; replace with actual verified model facts.
version: v0.3
listeners:
- name: inference
  address: 0.0.0.0
  port: 8000
  timeout: 120s
providers:
  models:
  - name: chat
    provider_model_id: chat-native
    api_format: openai
    backend_refs:
    - name: primary
      provider: vllm-omni
      base_url: http://chat:8000/v1
      api_key_env: MODEL_API_KEY
  - name: speech
    provider_model_id: speech-native
    api_format: speech
    backend_refs:
    - name: primary
